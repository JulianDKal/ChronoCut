<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  ChronoCut feature showcase.  Upload this in the app to demo everything.
  Colour -> operation:  red = vector engrave,  blue = cut,  green = raster.
  Coordinates are in points (1 pt = 0.3528 mm), so 800x520 pt = ~282x183 mm.

  What each group triggers:
   - green fill            -> Raster engrave region
   - red strokes           -> Vector engrave (lines + a curve)
   - blue outer rect       -> Cut (large part)
   - 8 tiny blue rects     -> "tiny parts may fall through the grid" warning + highlight
   - 6 blue circles        -> pushes the cut-part count > 10 -> handling-time warning
   - near-red / near-blue / near-green -> "Fix Colors" snaps them to pure
   - near-white line + fill -> "Remove White" deletes them
   - coincident red+blue line -> "Remove Doubles" finds & removes the red
   - purple line            -> the "Other" operation row in the breakdown
   - gray fill (far right)   -> grayscale = raster; far from the green block, so it
                               becomes its OWN raster box (proximity split)
-->

