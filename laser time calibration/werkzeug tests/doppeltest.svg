<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Testdatei fuer "Dopplungen entfernen".
  Blau #0000FF = Schnitt, Rot #FF0000 = Vektorgravur.

  Erwartetes Ergebnis nach dem Anwenden:
    A  eine der beiden Geraden verschwindet
    B  die rote Gerade verschwindet komplett (Blau gewinnt)
    C  aus zwei Geraden wird eine durchgehende von x=10 bis x=120
    D  eine der beiden Kurven verschwindet (als Kurve, nicht als Polygonzug)
    E  bleibt vollstaendig unangetastet  <- der wichtigste Teil des Tests
-->

<svg
   version="1.1"
   width="220.000mm"
   height="120.000mm"
   viewBox="0 0 220.000 120.000"
   id="svg22"
   sodipodi:docname="doppeltest.svg"
   inkscape:version="1.1.1 (3bf5ae0d25, 2021-09-20)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs26" />
  <sodipodi:namedview
     id="namedview24"
     pagecolor="#505050"
     bordercolor="#eeeeee"
     borderopacity="1"
     inkscape:pageshadow="0"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:document-units="mm"
     showgrid="false"
     inkscape:zoom="0.71758883"
     inkscape:cx="341.42114"
     inkscape:cy="315.64036"
     inkscape:window-width="1920"
     inkscape:window-height="991"
     inkscape:window-x="-9"
     inkscape:window-y="-9"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg22" />
  <!-- A: zwei exakt deckungsgleiche blaue Geraden -->
  <path
     d="M 10 15 L 110 15"
     stroke="#0000FF"
     stroke-width="0.026"
     fill="none"
     id="path2"
     style="stroke-width:0.00006879;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-miterlimit:4;stroke-dasharray:none" />
  <path
     d="M 10 15 L 110 15"
     stroke="#0000FF"
     stroke-width="0.026"
     fill="none"
     id="path4"
     style="stroke-width:0.00006879;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-miterlimit:4;stroke-dasharray:none" />
  <!-- B: rote Gerade exakt auf einer blauen -->
  <path
     d="M 10 30 L 110 30"
     stroke="#0000FF"
     stroke-width="0.026"
     fill="none"
     id="path6"
     style="stroke-width:0.00006879;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-miterlimit:4;stroke-dasharray:none" />
  <path
     d="M 10 30 L 110 30"
     stroke="#FF0000"
     stroke-width="0.026"
     fill="none"
     id="path8"
     style="stroke-width:0.00006879;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-miterlimit:4;stroke-dasharray:none" />
  <!-- C: zwei blaue Geraden, die sich von x=50 bis x=80 ueberlappen -->
  <path
     d="M 10 45 L 80 45"
     stroke="#0000FF"
     stroke-width="0.026"
     fill="none"
     id="path10"
     style="stroke-width:0.00006879;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-miterlimit:4;stroke-dasharray:none" />
  <path
     d="M 50 45 L 120 45"
     stroke="#0000FF"
     stroke-width="0.026"
     fill="none"
     id="path12"
     style="stroke-width:0.00006879;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-miterlimit:4;stroke-dasharray:none" />
  <!-- D: zwei exakt deckungsgleiche Bezierkurven -->
  <path
     d="M 10 100 C 40 60 80 60 110 100"
     stroke="#0000FF"
     stroke-width="0.026"
     fill="none"
     id="path14"
     style="stroke-width:0.00006879;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-miterlimit:4;stroke-dasharray:none" />
  <path
     d="M 10 100 C 40 60 80 60 110 100"
     stroke="#0000FF"
     stroke-width="0.026"
     fill="none"
     id="path16"
     style="stroke-width:0.00006879;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-miterlimit:4;stroke-dasharray:none" />
  <!-- E: Kontrollgruppe ohne jede Dopplung. Muss unveraendert bleiben,
       insbesondere muss das Rechteck geschlossen bleiben. -->
  <path
