     inkscape:label="path20"
     sodipodi:nodetypes="cc"
     style="stroke-width:0.00006879;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-miterlimit:4;stroke-dasharray:none" />
  <path
     d="m 140,75 c 20,35 50,35 70,0 0,0 4.31362,-7.986665 0.16562,-10.475468"
     stroke="#0000ff"
     stroke-width="0.026"
     fill="none"
     id="path20-8"
     inkscape:label="path20"
     sodipodi:nodetypes="cc"
     style="stroke:#ff0000;stroke-opacity:1;stroke-width:0.00006879;stroke-miterlimit:4;stroke-dasharray:none;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline" />
  <path
     d="m 91.7741,27.508122 c 20,35 50,35 70,0 0,0 4.31363,-7.986665 0.16562,-10.475468"
     stroke="#0000ff"
     stroke-width="0.026"
     fill="none"
     id="path20-8-3"
     inkscape:label="path20"
     sodipodi:nodetypes="cc"
     style="stroke:#ff0000;stroke-width:0.00000018;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline" />
</svg>
